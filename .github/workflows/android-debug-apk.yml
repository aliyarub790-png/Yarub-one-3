name: Android Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find the Android project
        id: locate
        run: |
          dir="$(find . -name settings.gradle.kts -not -path '*/build/*' -printf '%h\n' | head -1)"

          if [ -z "$dir" ]; then
            zip="$(ls *.zip 2>/dev/null | head -1)"
            if [ -z "$zip" ]; then
              echo "::error::No sources and no zip found in this repository."
              find . -maxdepth 2 -not -path './.git/*' | sort
              exit 1
            fi
            echo "No sources committed; building from $zip"
            unzip -q -o "$zip" -d _extracted
            dir="$(find _extracted -name settings.gradle.kts -not -path '*/build/*' -printf '%h\n' | head -1)"
          fi

          if [ -z "$dir" ]; then
            echo "::error::settings.gradle.kts not found even after unpacking."
            exit 1
          fi

          echo "Android project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: sh gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
